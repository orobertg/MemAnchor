# memanchor.yaml
# See memanchor/config.py's Config dataclass for every recognized field and
# its default -- an unrecognized key here just warns, it doesn't fail.

bind_host: 127.0.0.1
bind_port: 8894

embedding_model: sentence-transformers/all-MiniLM-L6-v2
embedding_dimensions: 384

contradiction_similarity_threshold: 0.92  # unvalidated default; calibrate before production

query_timeout_ms: 15000
validator_timeout_ms: 5000
max_validators_per_query: 3
decay_halflife: 10  # misses before a candidate's confidence decays to ~37% of base

sqlite_path: ./data/memanchor.db
chroma_path: ./data/chroma

# JSON-serializable fact shape schema. If this file doesn't exist, the
# generic adapter falls back to an empty shape (every attribute implicitly
# cardinality MANY). See fact_shape.example.json for the format.
fact_shape_path: ./fact_shape.json
